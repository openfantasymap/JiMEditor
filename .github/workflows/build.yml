name: Build & Release

# - every push / PR: build + tests (core file format + headless UI smoke tests with screenshots)
# - pushes to master, tags and manual runs: self-contained editor builds for Windows, macOS and Linux
# - tags v*: the builds are published as a GitHub Release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/JiME/JiME.csproj

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        env:
          JIME_SCREENSHOTS: ${{ github.workspace }}/screenshots
        run: dotnet test tests/JiME.Tests -c Release

      - name: Upload window screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: window-screenshots
          path: screenshots/
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.name }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: ubuntu-latest
            rid: win-x64
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
            artifact: linux-x64
          # the macOS app is bundled and ad-hoc signed on a Mac
          - name: macOS Apple Silicon
            os: macos-latest
            rid: osx-arm64
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-latest
            rid: osx-x64
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.19.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          SINGLE_FILE=true
          [[ "$RID" == osx-* ]] && SINGLE_FILE=false
          dotnet publish "$PROJECT" -c Release -r "$RID" --self-contained \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PublishSingleFile=$SINGLE_FILE -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=$SINGLE_FILE -p:DebugType=none -o publish
          # SkiaSharp/HarfBuzz ship ~100 MB of native debug symbols
          find publish -name '*.pdb' -delete
          du -sh publish

      - name: Package Windows / Linux
        if: ${{ !startsWith(matrix.rid, 'osx') }}
        shell: bash
        run: |
          mkdir -p dist
          NAME="JiME-Editor-${{ matrix.artifact }}"
          if [[ "$RID" == win-* ]]; then
            (cd publish && zip -qr "../dist/$NAME.zip" .)
          else
            chmod +x publish/JiME
            tar -czf "dist/$NAME.tar.gz" -C publish .
          fi

      - name: Package macOS app
        if: ${{ startsWith(matrix.rid, 'osx') }}
        run: |
          APP="dist/JiME Editor.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/ "$APP/Contents/MacOS/"
          sed "s/@VERSION@/${{ steps.version.outputs.version }}/g" build/macos/Info.plist > "$APP/Contents/Info.plist"

          # icon from the ring artwork
          ICONSET=$(mktemp -d)/JiME.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s src/JiME/Assets/ring.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) src/JiME/Assets/ring.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/JiME.icns"

          # Apple Silicon needs at least an ad-hoc signature; see README for first launch
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/JiME-Editor-${{ matrix.artifact }}.zip"
          rm -rf "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
